<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance | University Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar-custom">
        <div class="nav-container container">
            <a class="nav-brand" href="../index.html">University Dashboard</a>
            <div class="nav-links">
                <span class="nav-link text-signal">Student Performance</span>
            </div>
        </div>
    </nav>

    <main class="container section">
        <div class="row g-4">
            
            <div class="col-lg-6">
                <div class="app-card">
                    <h2 class="card-title">Enter Student Details</h2>
                    
                    <form id="performanceForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Student Name</label>
                                <input type="text" id="studentName" class="form-control" value="Ahmad Kaleem" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Student ID</label>
                                <input type="text" id="studentId" class="form-control" value="FA22-BCS-123" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Program</label>
                                <select id="program" class="form-select">
                                    <option value="BSCS">BS Computer Science</option>
                                    <option value="BSSE">BS Software Engineering</option>
                                    <option value="BBA">Bachelor of Business Admin</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Semester</label>
                                <select id="semester" class="form-select">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5" selected>5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Assignment Score (Out of 20)</label>
                                <input type="number" id="assignmentMarks" class="form-control" placeholder="0 - 20" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Quiz Score (Out of 30)</label>
                                <input type="number" id="quizMarks" class="form-control" placeholder="0 - 30" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Exam Score (Out of 50)</label>
                                <input type="number" id="examMarks" class="form-control" placeholder="0 - 50" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Total Attendance (%)</label>
                                <input type="number" id="attendance" class="form-control" placeholder="0 - 100" required>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn-primary-custom">Calculate Result</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="app-card d-flex flex-column">
                    <h2 class="card-title">Final Result</h2>
                    
                    <div id="resultBox" class="output-box flex-grow-1" style="display: none !important;">
                    </div>

                    <div id="initialState" class="output-box flex-grow-1 text-center justify-content-center">
                        <p class="text-dim font-mono mb-0">Fill in the details to see the student's result.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
