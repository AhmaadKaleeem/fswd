<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Application | University Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar-custom">
        <div class="nav-container container">
            <a class="nav-brand" href="../index.html">University Dashboard</a>
            <div class="nav-links">
                <span class="nav-link text-signal">Scholarship App</span>
            </div>
        </div>
    </nav>

    <main class="container section">
        <div class="row g-4">
            
            <div class="col-lg-6">
                <div class="app-card">
                    <h2 class="card-title">Student Details</h2>
                    
                    <form id="scholarshipForm">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Student Name</label>
                                <input type="text" id="studentName" class="form-control" value="Ahmad Kaleem" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Program</label>
                                <select id="program" class="form-select">
                                    <option value="BSCS">BS Computer Science</option>
                                    <option value="BSSE">BS Software Engineering</option>
                                    <option value="BBA">Bachelor of Business Admin</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Semester</label>
                                <select id="semester" class="form-select">
                                    <option value="1">Semester 1</option>
                                    <option value="2">Semester 2</option>
                                    <option value="3">Semester 3</option>
                                    <option value="4">Semester 4</option>
                                    <option value="5" selected>Semester 5</option>
                                    <option value="6">Semester 6</option>
                                    <option value="7">Semester 7</option>
                                    <option value="8">Semester 8</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Current GPA (0.0 - 4.0)</label>
                                <input type="number" id="cgpa" class="form-control" step="0.01" placeholder="e.g. 3.6" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Credit Hours Passed</label>
                                <input type="number" id="credits" class="form-control" placeholder="e.g. 45" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Overall Attendance (%)</label>
                                <input type="number" id="attendance" class="form-control" placeholder="0 - 100" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Annual Family Income ($)</label>
                                <input type="number" id="income" class="form-control" placeholder="e.g. 40000" required>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Previous Scholarship Status</label>
                                <select id="previousScholarship" class="form-select">
                                    <option value="none">None</option>
                                    <option value="active">Currently Holding Scholarship</option>
                                    <option value="revoked">Previously Revoked</option>
                                </select>
                            </div>
                            
                            <div class="col-md-12">
                                <label class="form-label">Scholarship Type</label>
                                <select id="scholarshipCategory" class="form-select">
                                    <option value="merit">Merit-Based Scholarship</option>
                                    <option value="need">Need-Based Financial Aid</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn-primary-custom">Check Eligibility</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="app-card d-flex flex-column">
                    <h2 class="card-title">Eligibility Result</h2>
                    
                    <div id="resultBox" class="output-box flex-grow-1" style="display: none !important;">
                    </div>

                    <div id="initialState" class="output-box flex-grow-1 text-center justify-content-center">
                        <p class="text-dim font-mono mb-0">Fill the form to see your result...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
