<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Store | University Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar-custom">
        <div class="nav-container container">
            <a class="nav-brand" href="../index.html">University Dashboard</a>
            <div class="nav-links">
                <span class="nav-link text-signal">Campus Store</span>
            </div>
        </div>
    </nav>

    <main class="container section">
        <div class="row g-4">
            
            <div class="col-lg-6">
                <div class="app-card">
                    <h2 class="card-title">Shopping Cart</h2>
                    
                    <form id="shoppingForm">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Select Item</label>
                                <select id="productName" class="form-select">
                                    <option value="Laptop M2" data-price="1200">Laptop M2 - $1200</option>
                                    <option value="Smartphone" data-price="800">Smartphone G2 - $800</option>
                                    <option value="Tablet" data-price="450">Tablet X - $450</option>
                                    <option value="Headphones" data-price="150">Wireless Headphones - $150</option>
                                    <option value="Smart Watch" data-price="250">Smart Watch - $250</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Item Price ($)</label>
                                <input type="number" id="unitPrice" class="form-control" value="1200" required readonly>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Quantity</label>
                                <input type="number" id="quantity" class="form-control" value="1" min="1" required>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Buyer Type</label>
                                <select id="customerType" class="form-select">
                                    <option value="regular">Regular Buyer</option>
                                    <option value="premium">Premium Member</option>
                                    <option value="student">Student</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn-primary-custom">Checkout</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="app-card d-flex flex-column">
                    <h2 class="card-title">Order Summary</h2>
                    
                    <div id="resultBox" class="output-box flex-grow-1" style="display: none !important;">
                    </div>

                    <div id="initialState" class="output-box flex-grow-1 text-center justify-content-center">
                        <p class="text-dim font-mono mb-0">Cart is empty...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
