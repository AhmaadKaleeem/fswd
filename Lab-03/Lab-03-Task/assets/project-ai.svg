<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#aiGrad)"/>
  <rect x="20" y="20" width="560" height="320" rx="8" fill="#0d0d0d" stroke="#262626" stroke-width="1.5"/>

  <!-- Neural Network Nodes & Links -->
  <!-- Layer 1 -->
  <circle cx="80" cy="90" r="14" fill="#1f1f1f" stroke="#df6513" stroke-width="2"/>
  <circle cx="80" cy="180" r="14" fill="#1f1f1f" stroke="#df6513" stroke-width="2"/>
  <circle cx="80" cy="270" r="14" fill="#1f1f1f" stroke="#df6513" stroke-width="2"/>

  <!-- Layer 2 -->
  <circle cx="210" cy="60" r="14" fill="#1f1f1f" stroke="#059d00" stroke-width="2"/>
  <circle cx="210" cy="140" r="14" fill="#1f1f1f" stroke="#059d00" stroke-width="2"/>
  <circle cx="210" cy="220" r="14" fill="#1f1f1f" stroke="#059d00" stroke-width="2"/>
  <circle cx="210" cy="300" r="14" fill="#1f1f1f" stroke="#059d00" stroke-width="2"/>

  <!-- Layer 3 -->
  <circle cx="340" cy="100" r="14" fill="#1f1f1f" stroke="#df6513" stroke-width="2"/>
  <circle cx="340" cy="180" r="14" fill="#1f1f1f" stroke="#df6513" stroke-width="2"/>
  <circle cx="340" cy="260" r="14" fill="#1f1f1f" stroke="#df6513" stroke-width="2"/>

  <!-- Output Node / Agent Core -->
  <circle cx="480" cy="180" r="28" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
  <text x="480" y="185" fill="#ffffff" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">AGENT</text>

  <!-- Connectors -->
  <!-- 1 to 2 -->
  <line x1="94" y1="90" x2="196" y2="60" stroke="#333" stroke-width="1.2"/>
  <line x1="94" y1="90" x2="196" y2="140" stroke="#df6513" stroke-width="1.8" opacity="0.8"/>
  <line x1="94" y1="180" x2="196" y2="140" stroke="#333" stroke-width="1.2"/>
  <line x1="94" y1="180" x2="196" y2="220" stroke="#df6513" stroke-width="1.8" opacity="0.8"/>
  <line x1="94" y1="270" x2="196" y2="220" stroke="#333" stroke-width="1.2"/>
  <line x1="94" y1="270" x2="196" y2="300" stroke="#333" stroke-width="1.2"/>

  <!-- 2 to 3 -->
  <line x1="224" y1="60" x2="326" y2="100" stroke="#059d00" stroke-width="1.5"/>
  <line x1="224" y1="140" x2="326" y2="100" stroke="#333" stroke-width="1.2"/>
  <line x1="224" y1="140" x2="326" y2="180" stroke="#059d00" stroke-width="2"/>
  <line x1="224" y1="220" x2="326" y2="180" stroke="#333" stroke-width="1.2"/>
  <line x1="224" y1="220" x2="326" y2="260" stroke="#059d00" stroke-width="1.5"/>
  <line x1="224" y1="300" x2="326" y2="260" stroke="#333" stroke-width="1.2"/>

  <!-- 3 to Output -->
  <line x1="354" y1="100" x2="453" y2="170" stroke="#df6513" stroke-width="1.5"/>
  <line x1="354" y1="180" x2="452" y2="180" stroke="#ffffff" stroke-width="2"/>
  <line x1="354" y1="260" x2="453" y2="190" stroke="#059d00" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="80" y="45" fill="#777" font-family="'Space Mono', monospace" font-size="10" text-anchor="middle">EMBEDDINGS</text>
  <text x="210" y="35" fill="#777" font-family="'Space Mono', monospace" font-size="10" text-anchor="middle">RAG PIPELINE</text>
  <text x="340" y="45" fill="#777" font-family="'Space Mono', monospace" font-size="10" text-anchor="middle">TOOL CALLING</text>
</svg>
