<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#df6513"/>
      <stop offset="100%" stop-color="#ff8c3b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#webGrad)"/>
  <rect x="20" y="20" width="560" height="320" rx="8" fill="#0d0d0d" stroke="#262626" stroke-width="1.5"/>
  
  <!-- Browser Header -->
  <rect x="20" y="20" width="560" height="36" rx="8" fill="#181818"/>
  <circle cx="45" cy="38" r="5" fill="#ff5f56"/>
  <circle cx="62" cy="38" r="5" fill="#ffbd2e"/>
  <circle cx="79" cy="38" r="5" fill="#27c93f"/>
  <rect x="110" y="29" width="300" height="18" rx="4" fill="#0d0d0d" stroke="#333"/>
  <text x="125" y="42" fill="#777" font-family="'Space Mono', monospace" font-size="10">https://app.enterprise-saas.io</text>
  
  <!-- Web Layout Mockup -->
  <!-- Sidebar -->
  <rect x="35" y="70" width="100" height="255" rx="6" fill="#141414" stroke="#222"/>
  <rect x="45" y="85" width="80" height="12" rx="3" fill="#333"/>
  <rect x="45" y="110" width="60" height="8" rx="2" fill="#222"/>
  <rect x="45" y="128" width="70" height="8" rx="2" fill="#df6513" opacity="0.8"/>
  <rect x="45" y="146" width="55" height="8" rx="2" fill="#222"/>
  <rect x="45" y="164" width="65" height="8" rx="2" fill="#222"/>
  
  <!-- Dashboard Grid -->
  <rect x="150" y="70" width="415" height="110" rx="6" fill="#141414" stroke="#222"/>
  <!-- Chart line -->
  <polyline points="170,150 220,120 270,140 330,95 400,115 470,85 540,110" fill="none" stroke="url(#accentOrange)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="470" cy="85" r="4" fill="#df6513"/>
  <circle cx="330" cy="95" r="4" fill="#df6513"/>

  <!-- Metric Cards -->
  <rect x="150" y="195" width="130" height="130" rx="6" fill="#141414" stroke="#222"/>
  <text x="165" y="225" fill="#df6513" font-family="'Space Mono', monospace" font-size="20" font-weight="bold">99.9%</text>
  <text x="165" y="245" fill="#888" font-family="'Inter', sans-serif" font-size="11">Uptime SLA</text>
  
  <rect x="292" y="195" width="130" height="130" rx="6" fill="#141414" stroke="#222"/>
  <text x="307" y="225" fill="#059d00" font-family="'Space Mono', monospace" font-size="20" font-weight="bold">42ms</text>
  <text x="307" y="245" fill="#888" font-family="'Inter', sans-serif" font-size="11">Avg Latency</text>

  <rect x="435" y="195" width="130" height="130" rx="6" fill="#141414" stroke="#222"/>
  <text x="450" y="225" fill="#ffffff" font-family="'Space Mono', monospace" font-size="20" font-weight="bold">128k</text>
  <text x="450" y="245" fill="#888" font-family="'Inter', sans-serif" font-size="11">Active Users</text>
</svg>
