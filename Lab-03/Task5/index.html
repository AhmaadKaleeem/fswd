<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Parking | University Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar-custom">
        <div class="nav-container container">
            <a class="nav-brand" href="../index.html">University Dashboard</a>
            <div class="nav-links">
                <span class="nav-link text-signal">Campus Parking</span>
            </div>
        </div>
    </nav>

    <main class="container section">
        <div class="row g-4">
            
            <div class="col-lg-6">
                <div class="app-card">
                    <h2 class="card-title">Parking Access Request</h2>
                    
                    <form id="parkingForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Vehicle Plate Number</label>
                                <input type="text" id="plate" class="form-control" value="ABC-1234" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Vehicle Type</label>
                                <select id="vehicleType" class="form-select">
                                    <option value="car">Car (4-Wheeler)</option>
                                    <option value="bike">Motorcycle (2-Wheeler)</option>
                                    <option value="bus">University Bus</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Driver Type</label>
                                <select id="ownerType" class="form-select">
                                    <option value="faculty">Faculty / Staff</option>
                                    <option value="student">Student</option>
                                    <option value="visitor">Visitor</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Valid University ID?</label>
                                <select id="hasId" class="form-select">
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Permit Status</label>
                                <select id="permitStatus" class="form-select">
                                    <option value="valid">Permit Valid</option>
                                    <option value="expired">Permit Expired</option>
                                    <option value="none">No Permit</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Special Access</label>
                                <select id="specialAccess" class="form-select">
                                    <option value="none">None</option>
                                    <option value="vip">VIP / Executive</option>
                                    <option value="disabled">Disabled Parking</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Requested Parking Area</label>
                                <select id="parkingArea" class="form-select">
                                    <option value="faculty_zone">Faculty Zone</option>
                                    <option value="student_zone">Student Zone</option>
                                    <option value="visitor_zone">Visitor Zone</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Spaces Available in Area</label>
                                <input type="number" id="spaces" class="form-control" value="10" required>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Estimated Parking Time (Hours)</label>
                                <input type="number" id="parkingTime" class="form-control" value="2" min="1" max="24" required>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn-primary-custom">Check Access</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="app-card d-flex flex-column">
                    <h2 class="card-title">Gate Status</h2>
                    
                    <div id="resultBox" class="output-box flex-grow-1" style="display: none !important;">
                    </div>

                    <div id="initialState" class="output-box flex-grow-1 text-center justify-content-center">
                        <p class="text-dim font-mono mb-0">Waiting for vehicle request...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
