<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration | University Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar-custom">
        <div class="nav-container container">
            <a class="nav-brand" href="../index.html">University Dashboard</a>
            <div class="nav-links">
                <span class="nav-link text-signal">Course Registration</span>
            </div>
        </div>
    </nav>

    <main class="container section">
        <div class="row g-4">
            
            <div class="col-lg-6">
                <div class="app-card">
                    <h2 class="card-title">Registration Form</h2>
                    
                    <form id="registrationForm">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Course Name</label>
                                <select id="courseId" class="form-select" required>
                                    <!-- Options will be dynamically populated via JS -->
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Current GPA (0.0 - 4.0)</label>
                                <input type="number" id="cgpa" class="form-control" step="0.01" placeholder="e.g. 3.2" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Semester</label>
                                <select id="semester" class="form-select">
                                    <option value="1">Semester 1</option>
                                    <option value="2">Semester 2</option>
                                    <option value="3">Semester 3</option>
                                    <option value="4">Semester 4</option>
                                    <option value="5" selected>Semester 5</option>
                                    <option value="6">Semester 6</option>
                                    <option value="7">Semester 7</option>
                                    <option value="8">Semester 8</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Prerequisites Status</label>
                                <select id="prerequisite" class="form-select">
                                    <option value="completed">All Prerequisites Cleared</option>
                                    <option value="incomplete">Prerequisites Missing</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Fee Status</label>
                                <select id="feeStatus" class="form-select">
                                    <option value="cleared">Fees Paid</option>
                                    <option value="unpaid">Outstanding Dues</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Seat Availability</label>
                                <select id="availability" class="form-select">
                                    <option value="available">Seats Available</option>
                                    <option value="full">Class is Full</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn-primary-custom">Register</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="app-card d-flex flex-column">
                    <h2 class="card-title">Registration Status</h2>
                    
                    <div id="resultBox" class="output-box flex-grow-1" style="display: none !important;">
                    </div>

                    <div id="initialState" class="output-box flex-grow-1 text-center justify-content-center">
                        <p class="text-dim font-mono mb-0">Waiting for submission...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
